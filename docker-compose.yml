# Local, reproducible stack: PostgreSQL 18 + pgvector, SeaweedFS (S3), API/web, worker.
# Internal services are bound to 127.0.0.1 only. DEV credentials below are not secrets: never reuse them.
#   docker compose up -d --build
#   docker compose exec api node src/scripts/create-user.ts --email you@company.it --name "Nome" --role admin
name: products-comparator
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_USER: comparator
      POSTGRES_PASSWORD: comparator_dev
      POSTGRES_DB: comparator
    volumes:
      - pgdata:/var/lib/postgresql
    shm_size: 1g
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comparator -d comparator"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed:/data
      - ./deploy/seaweedfs-s3.dev.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"

  api:
    build: .
    env_file: .env
    environment: &appenv
      NODE_ENV: development
      HOST: 0.0.0.0
      PUBLIC_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://comparator:comparator_dev@postgres:5432/comparator
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: comparator
      S3_ACCESS_KEY_ID: comparator
      S3_SECRET_ACCESS_KEY: comparator_dev_secret
      VISION_CACHE_DIR: /app/.models
    volumes:
      - models:/app/.models
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_started }

  worker:
    build: .
    command: ["node", "src/worker/index.ts"]
    env_file: .env
    environment: *appenv
    volumes:
      - models:/app/.models
    healthcheck:
      disable: true
    stop_grace_period: 5m
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_started }

volumes:
  pgdata:
  seaweed:
  models:
